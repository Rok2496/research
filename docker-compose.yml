version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.prod
    ports:
      - '8000:8000'
      - '6006:6006'
    volumes:
      - .:/app
      - model_data:/app/models
    environment:
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis
    networks:
      - chexpert_network

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=\
      - POSTGRES_PASSWORD=\
      - POSTGRES_DB=\
    networks:
      - chexpert_network

  redis:
    image: redis:6
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - chexpert_network

  monitoring:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.monitoring
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring:/etc/prometheus
    networks:
      - chexpert_network

volumes:
  postgres_data:
  redis_data:
  model_data:

networks:
  chexpert_network:
    driver: bridge

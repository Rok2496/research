data:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  train_path: data/train
  val_path: data/val
logging:
  mlflow:
    experiment_name: chexpert_training
    tracking_uri: postgresql://postgres:1234@localhost:5432/mlflow
preprocessing:
  augmentation:
    cutmix:
      beta: 1.0
      enabled: true
    elastic:
      alpha: 1000
      enabled: true
      sigma: 50
    enabled: true
    mixup:
      alpha: 0.2
      enabled: true
  clahe:
    clip_limit: 2.0
    enabled: true
    tile_grid_size:
    - 8
    - 8
  image_size:
  - 320
  - 320
training:
  validation:
    frequency: 1
    metrics:
    - accuracy
    - auroc
    - f1_score
